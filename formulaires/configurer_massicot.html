<div class="formulaire_spip formulaire_configurer formulaire_#FORM">
	<h3 class="titrem"><:massicot:configuration_titre:></h3>
	[<p class="reponse_formulaire reponse_formulaire_ok">(#ENV*{message_ok})</p>]
	[<p class="reponse_formulaire reponse_formulaire_erreur">(#ENV*{message_erreur})</p>]

	<form method="post" action="#ENV{action}"><div>
		#ACTION_FORMULAIRE{#ENV{action}}
		<div class="editer-groupe">
			<div class="editer editer_mode_compatibilite">
				<div class="choix">
					<input type="checkbox" name="mode_compatibilite" class="checkbox" id="mode_compatibilite" value="oui"[(#ENV{mode_compatibilite}|=={oui}|oui) checked="checked"] />
					<label for="mode_compatibilite"><:massicot:mode_compatibilite_label:></label>
				</div>
				<p class="explication"><:massicot:mode_compatibilite_explication:></p>
			</div>
		</div>
		<p class="boutons"><button type="submit" class="submit"><:bouton_enregistrer:></button></p>
	</div></form>
</div>
